[plugin]
id = "galgame_bridge"
name = "Galgame游玩助手"
description = "让猫娘陪伴你一起玩galgame"
short_description = "Read local galgame bridge files and expose status, snapshots, history, and a web UI."
keywords = ["galgame", "bridge", "renpy", "visual novel", "game state", "剧情", "台词", "选项"]
version = "0.1.0"
type = "plugin"
entry = "plugin.plugins.galgame_bridge:GalgameBridgePlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = false

[plugin.store]
enabled = true

[galgame]
bridge_root = "/Users/stg-mba004/Code/Neko RenPy Bridge Demo/bridge_dev"
active_poll_interval_seconds = 1
idle_poll_interval_seconds = 3
stale_after_seconds = 15
history_events_limit = 500
history_lines_limit = 200
history_choices_limit = 50
dedupe_window_limit = 64
warmup_replay_bytes_limit = 65536
warmup_replay_events_limit = 50
default_mode = "companion"
push_notifications = true

[llm]
llm_call_timeout_seconds = 15
llm_max_in_flight = 2
llm_request_cache_ttl_seconds = 2
target_entry_ref = "galgame_llm_target:galgame_llm_target_invoke"

[memory_reader]
enabled = false
textractor_path = ""
auto_detect = true
poll_interval_seconds = 1
